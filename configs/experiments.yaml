experiments:
  p0_baseline:
    phase: prompting
    family: baseline
    track: direct
    mode: single_pass
    description: Direct translation baseline.
    generation_profile: baseline
    prompt:
      label: p0_baseline
      single_user_prompt_template: |-
        Translate the following English text into {target_lang}. Return only the translation.

        {source}
      enable_thinking: false

  p1_naturalness:
    phase: prompting
    family: prompting
    track: system_prompts
    mode: single_pass
    description: Direct prompt focused on natural target-language wording.
    generation_profile: baseline
    prompt:
      label: p1_naturalness
      single_user_prompt_template: |-
        Translate the following English text into {target_lang}, ensuring that the translation is fluent, accurate, and conforms to typical {target_lang} expressions and style. Return only the translation.

        {source}
      enable_thinking: false

  p2_polishing:
    phase: prompting
    family: prompting
    track: self_polishing
    mode: self_polish
    description: Two-pass translation and self-polishing.
    initial_generation_profile: baseline
    refinement_generation_profile: baseline
    initial_prompt:
      label: p2_initial_p0_baseline
      single_user_prompt_template: |-
        Translate the following English text into {target_lang}. Return only the translation.

        {source}
      enable_thinking: false
    refinement_prompt:
      label: p2_polishing
      single_user_prompt_template: |-
        Polish the following {target_lang} translation of an English text. Preserve its meaning and return one fluent, accurate, natural {target_lang} translation.

        Put the final translation between <translation> and </translation>.
        Do not write anything outside these tags. Do not include explanations, comments, alternatives, labels, or quotation marks.

        Source text:
        {source}

        Original translation:
        {baseline_prediction}
      enable_thinking: false

  p3_step_by_step:
    phase: prompting
    family: advanced
    track: step_by_step
    mode: step_by_step_pipeline
    description: Four-stage step-by-step translation workflow.
    generation_profile: baseline
    stages:
    - key: research
      prompt:
        label: step_by_step_research
        single_user_prompt_template: |-
          You will be asked to translate a piece of text form English into {target_lang} following the five stages of the
          translation process. Here is the context in which the text appears:
          Context: {source}
          To start, let’s do some pre-drafting research on the above context:
          Research:
          During this phase, thorough research is essential to address components of the context text that pose
          translation challenges. The goal is to establish a comprehensive translation plan that covers the following
          category:
          - Idiomatic Expressions:
          - Identify idiomatic expressions that cannot be directly translated word-for-word into {target_lang}.
        enable_thinking: false
    - key: draft
      prompt:
        label: step_by_step_drafting
        single_user_prompt_template: |-
          Now, let’s move on to the drafting stage.
          Draft Translation:
          In this phase, your primary objective is to create a draft translation into {target_lang} that accurately conveys the meaning
          of the source text presented below. At this stage, it is crucial to focus on adequacy, ensuring that your
          translation closely adheres to the source text. Your response should conclude with the draft translation in {target_lang}. If
          context is missing, generate a general translation that is adaptable to various contexts. Avoid adding any
          additional information not present in the source text. All elements of the source text should be present in
          the translation.
          Use the pre-drafting analysis below.
          Pre-drafting analysis:
          {research}

          Give your best one translation into {target_lang} for the following piece of text based on the pre-drafting analysis without
          providing alternatives. Return only the {target_lang} translation:
          English: {source}
        enable_thinking: false
    - key: refinement
      prompt:
        label: step_by_step_refinement
        single_user_prompt_template: |-
          Now let’s move to the next stage.
          Post-editing with local refinement
          In this stage, the primary aim is to refine the draft {target_lang} translation by making micro-level improvements that
          improve the draft’s fluency.
          Provide only one refined {target_lang} translation and do not output anything else after that.

          Source Text:
          {source}

          Draft Translation:
          {draft_translation}
        enable_thinking: false
    - key: proofreading
      prompt:
        label: step_by_step_proofreading
        single_user_prompt_template: |-
          You are tasked with proofreading a {target_lang} translation that has been revised for improved fluency. The refined
          translation has been generated by editing the draft translation.
          Proofreading and Final Editing
          The goal is to provide a polished final {target_lang} translation of the source text. For you reference, below are the
          source text, the draft, and refined translations.
          Source Text
          {source}
          Draft Translation
          {draft_translation}
          Refined Translation
          {refined_translation}
          Please proofread the refined text for grammar, spelling, punctuation, terminology, and overall fluency.
          Ensure the translation accurately reflects the original meaning and style.

          Put the final translation between <translation> and </translation>.
          Do not write anything outside these tags. Do not include explanations, comments, alternatives, labels, or quotation marks.
        enable_thinking: false
  p4_sft:
    phase: post_training
    family: post_training
    track: sft
    mode: sft_training
    description: Supervised fine-tuning.
    config: configs/sft.yaml

  p5_grpo:
    phase: post_training
    family: post_training
    track: grpo
    mode: grpo_training
    description: GRPO from the P4 SFT adapter.
    config: configs/grpo.yaml
