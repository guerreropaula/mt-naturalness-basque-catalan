defaults:
  backend: vllm
  dtype: bf16
  quantization: null
  max_context_length: 8192
  tensor_parallel_size: 1
  chat_template_options: {}
  prompt_adapter: chat
  enable_thinking: false
  gated: false

models:

  latxa_8b_instruct:
    hf_id: HiTZ/Latxa-Llama-3.1-8B-Instruct
    family: llama3
    parameter_scale: 8B
    instruction_tuned: true
    comparison_group: main_7_8b
    gated: false

  qwen3_8b:
    hf_id: Qwen/Qwen3-8B
    family: qwen3
    parameter_scale: 8B
    instruction_tuned: true
    comparison_group: main_7_8b
    enable_thinking: false

  salamandrata_7b_instruct:
