    family: salamandra
    parameter_scale: 7B
    instruction_tuned: true
    comparison_group: main_7_8b
    prompt_adapter: salamandrata_translation

  salamandra_7b_instruct:
    hf_id: BSC-LT/salamandra-7b-instruct
    family: salamandra
    parameter_scale: 7B
    instruction_tuned: true
    comparison_group: main_7_8b

  gemma3_12b_it:
