grpo:
  data_dir: data/training
  adapter_root: models/p5_grpo
  results_root: results/p5_grpo
  sft_adapter_roots:
    en_ca: models/p4_sft
    en_eu: models/p4_sft
  target_languages:
    en_ca: ca
    en_eu: eu

  chat_format:
    enable_thinking: false
    prompt_spec:
      label: p4_p5_direct_translation
      single_user_prompt_template: |-
        Translate the following English text into {target_lang}. Return only the translation.

        {source}

  # Must match the P4 adapter.
  lora:
    r: 64
    lora_alpha: 128

  reward:
    active_ablation: a2
    group_size: 8
    cometkiwi:
      model: Unbabel/wmt23-cometkiwi-da-xl
      batch_size: 4
      gpus: 1
    comet:
      # Reference-based COMET used only by A5, the paper-comparison condition.
      model: Unbabel/wmt22-comet-da
      batch_size: 4
      gpus: 1
    # Validity gate for EOS-only completions; the weighted reward applies to
    # every non-empty translation exactly as specified for each ablation.
    empty_candidate_reward: -1.0
    classifier:
      # Used by A3.
      model_dirs:
        en_ca: results/classifiers/en_ca/reference_likeness_v1/best_model
        en_eu: results/classifiers/en_eu/reference_likeness_v1/best_model
      max_length: 256
      batch_size: 64
    ablations:
      a0:
        description: Quality only.
        weights:
          chrfpp: 0.45
          cometkiwi: 0.55
      a1:
        description: Quality and length control.
        weights:
          chrfpp: 0.40
          cometkiwi: 0.50
          length: 0.10
      a2:
        description: Quality, diversity, and length control.
        weights:
          chrfpp: 0.30
          cometkiwi: 0.40
          self_bleu: 0.20
          length: 0.10
      a3:
        description: Quality, reference-likeness, diversity, and length control.
        weights:
          chrfpp: 0.25
          cometkiwi: 0.35
          reference_likeness: 0.15
          self_bleu: 0.15
          length: 0.10
      a4:
        description: Quality, reference-likeness, and length control.
        weights:
          chrfpp: 0.30
          cometkiwi: 0.40
          reference_likeness: 0.20
          length: 0.10
      a3v2:
        description: A3 rerun with the five-sentence SFT-hard-negative classifier (analysis-only granularity).
        classifier_model_dirs:
          en_eu: results/classifiers/en_eu/reference_likeness_sft5_chunks_v2/best_model
          en_ca: results/classifiers/en_ca/reference_likeness_sft5_chunks_v2/best_model
        weights:
          chrfpp: 0.25
          cometkiwi: 0.35
          reference_likeness: 0.15
          self_bleu: 0.15
          length: 0.10
      a3v5:
        description: A3 rerun with sentence-level SFT-hard-negative classifier v3.
        classifier_model_dirs:
          en_eu: results/classifiers/en_eu/reference_likeness_sft_hard_sentence_v3/best_model
          en_ca: results/classifiers/en_ca/reference_likeness_sft_hard_sentence_v3/best_model
        weights:
          chrfpp: 0.25
          cometkiwi: 0.35
          reference_likeness: 0.15
          self_bleu: 0.15
          length: 0.10
      a3v3:
        description: A3 rerun with calibrated contrastive HT-versus-MT LM naturalness.
        contrastive_lm_datasets:
          - en_eu
          - en_ca
        contrastive_lm_config: configs/contrastive_lm.yaml
        weights:
          chrfpp: 0.25
          cometkiwi: 0.35
          reference_likeness: 0.15
          self_bleu: 0.15
          length: 0.10
      a3v4:
        description: A3 rerun with calibrated Qwen3 HT-versus-MT LM naturalness.
        contrastive_lm_datasets:
          - en_eu
          - en_ca
        contrastive_lm_config: configs/contrastive_lm_qwen.yaml
        weights:
          chrfpp: 0.25
          cometkiwi: 0.35
          reference_likeness: 0.15
          self_bleu: 0.15
          length: 0.10
      a5:
        description: "Paper-comparison reward: BLEU, reference-based COMET, diversity, and length."
        weights:
          bleu: 0.30
          comet: 0.40
          self_bleu: 0.20
          length: 0.10

  model_overrides:
    latxa_70b_instruct:
      lora:
        autocast_adapter_dtype: false
      reward:
        # Keep the reward model off the four GPUs shared by FSDP and vLLM.
        cometkiwi:
          gpus: 0
      training:
        # FSDP and colocated vLLM share the same four-GPU allocation.
        required_world_size: 4
        required_cuda_devices: 4
        required_model_devices: 0
        save_only_model: true
        gradient_accumulation_steps: 32
        use_vllm: true
        vllm_mode: colocate
        vllm_native_lora: true
        vllm_tensor_parallel_size: 4
        vllm_gpu_memory_utilization: 0.90
        vllm_model_kwargs:
          dtype: bfloat16
          max_num_seqs: 16
          enforce_eager: true
          enable_sleep_mode: true
          kv_cache_memory_bytes: 268435456
          enable_lora: true
          max_loras: 1
          max_cpu_loras: 1
          max_lora_rank: 64
          fully_sharded_loras: true
          disable_custom_all_reduce: true

  training:
    seed: 42
    num_train_epochs: 1
    per_device_train_batch_size: 1
    # Evaluation must contain one complete G=8 candidate group.
    per_device_eval_batch_size: 8
    # TRL counts G completions in its effective batch. Accumulating 128
    # completions with G=8 gives 16 distinct source prompts per update.
    gradient_accumulation_steps: 128
    effective_prompt_batch_size: 16
    # Keep each rollout generation batch at the previous memory-safe size:
    # 16 completions = 2 source prompts x G=8.
    generation_batch_size: 16
    learning_rate: 5.0e-6
    weight_decay: 0.0
    max_grad_norm: 1.0
    warmup_ratio: 0.0
    lr_scheduler_type: linear
    optim: adamw_bnb_8bit
    logging_steps: 5
    # Evaluation is run once after training on the held-out in-domain test set.
    eval_strategy: "no"
    eval_steps: 100
    save_strategy: steps
    save_steps: 100
    save_total_limit: 3
    disable_dropout: true
    gradient_checkpointing: true
    gradient_checkpointing_kwargs:
      use_reentrant: false
    bf16: true
    tf32: true
    # P5 samples with the training model's Transformers generation path.
    use_vllm: false
    num_generations: 8
    # P5 uses a 512-token total generation window: 256 prompt + 256 completion.
    max_prompt_length: 256
    max_completion_length: 256
    temperature: 0.6
    beta: 0.0
    # Do not reinforce candidates that never emit EOS.
    mask_truncated_completions: true
    # Not applicable to online rollouts.
    sequence_packing: false
    generation_kwargs:
      do_sample: true
      num_beams: 1
      top_p: 0.9
      top_k: 50
      # Prevent an EOS-only completion before the validity gate can act.
      min_new_tokens: 4
