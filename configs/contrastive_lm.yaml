contrastive_lm:
  # Five-sentence SFT-hard-negative chunks shared with classifier v2.
  data_root: data/classifier_chunks/sft5
  adapter_root: models/contrastive_lm
  results_root: results/contrastive_lm

  labels:
    ht: 1
    mt: 0

  languages:
    en_eu:
      target_language: eu
      base_model: bigscience/bloom-560m
    en_ca:
      target_language: ca
      base_model: bigscience/bloom-560m

  model:
    load_in_4bit: true
    max_length: 256
    lora:
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules:
        - query_key_value

  training:
    seed: 42
    num_train_epochs: 1
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 8
    gradient_accumulation_steps: 4
    learning_rate: 2.0e-4
    weight_decay: 0.0
    warmup_ratio: 0.05
    lr_scheduler_type: linear
    optim: adamw_bnb_8bit
    logging_steps: 25
    save_total_limit: 1
    bf16: true
    gradient_checkpointing: true

  scoring:
    batch_size: 8
    text_field: prediction
